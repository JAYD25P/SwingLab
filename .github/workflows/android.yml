name: SwingLab Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Android project archive
        run: |
          base64 --decode SwingLab-Android-Source.zip.b64 > swinglab-source.zip
          mkdir -p SwingLab-project
          python3 -c "import zipfile; zipfile.ZipFile('swinglab-source.zip').extractall('SwingLab-project')"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p SwingLab-project assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SwingLab-debug-apk
          path: SwingLab-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

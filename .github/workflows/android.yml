name: SwingLab Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and repair source archive
        run: |
          base64 --decode SwingLab-Android-Source.zip.b64 > swinglab-source.zip
          python3 - <<'PY'
          from pathlib import Path
          p = Path("swinglab-source.zip")
          data = p.read_bytes().replace(b"SwingLabWidget.kw", b"SwingLabWidget.kt")
          p.write_bytes(data)
          import zipfile
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt archive member: {bad}")
              z.extractall("SwingLab-project")
          widget = Path("SwingLab-project/app/src/main/java/com/swinglab/widget/SwingLabWidget.kt")
          source = widget.read_text()
          if "import androidx.compose.ui.unit.dp" not in source:
              source = source.replace("package com.swinglab.widget\n", "package com.swinglab.widget\n\nimport androidx.compose.ui.unit.dp\n", 1)
              widget.write_text(source)
          widget_source = widget.read_text()
          widget_source = widget_source.replace("import androidx.glance.layout.defaultWeight\\n", "")
          widget_source = widget_source.replace("import androidx.glance.unit.dp\\n", "")
          widget_source = widget_source.replace("Spacer(GlanceModifier.defaultWeight())", "Spacer(GlanceModifier.height(8.dp))")
          widget.write_text(widget_source)
          activity = Path("SwingLab-project/app/src/main/java/com/swinglab/MainActivity.kt")
          activity_source = activity.read_text()
          if "import androidx.glance.appwidget.updateAll" not in activity_source:
              activity_source = activity_source.replace("package com.swinglab\\n", "package com.swinglab\\n\\nimport androidx.glance.appwidget.updateAll\\n", 1)
              activity.write_text(activity_source)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > SwingLab-project/local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p SwingLab-project assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SwingLab-debug-apk
          path: SwingLab-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
